[package]
name = "speedy"
version = "0.1.0"
edition = "2024"

[lib]
name = "speedy"
crate-type = ["cdylib"]

[dependencies]
indexmap = "2.14.1"
pyo3 = { version = "0.29.2", features = ["time"] }
uriparse = "0.6.4"
url = "2.5.8"
cookie = { version = "0.18.2", features = ["percent-encode"] }
time = "0.3.55"
tempfile = "3.27.0"
regex = "1.13.1"
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
md5 = "0.8.1"
