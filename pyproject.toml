[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speedy"
version = "0.0.1"
authors = [
    { name = "Alexander Kuzmin", email = "qrer71@yandex.ru" },
    { name = "Alexander Kuzmin", email = "funks.1@yandex.ru" }
]
license = { file = "LICENSE" }
description = "In development"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "anyio>=4.10.0",
    "typing-extensions",
]

[project.optional-dependencies]
msgpack = [
    "msgpack<=1.1.2",
]
dev = [
    "covdefaults",
    "pytest<=9.0.3",
    "httpx<=0.28.1",
    "pytest-cov",
    "time-machine<=3.2.0",
    "pytest-asyncio<=1.3.0",
    "pytest-mock<=3.15.1",
    "tox>=4.53.0",
    "msgpack<=1.1.2",
    "trio<=0.33.0",
]

[tool.tox]
requires = ["tox>=4.53.0", "tox-uv>=0.11.0"]
env_list = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.tox.env_run_base]
description = "Run test under {base_python}"
commands = [["uv", "run", "pytest"]]

[project.urls]
"Homepage" = "https://github.com/WolfMTK/speedy"
"Repository" = "https://github.com/WolfMTK/speedy"

[tool.coverage.run]
concurrency = ["multiprocessing", "thread"]
omit = ["*/tests/*"]
parallel = true
plugins = ["covdefaults"]
source = ["speedy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    'ignore:function ham\(\) is deprecated:DeprecationWarning',
]
